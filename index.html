<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 잠금화면</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0078d4 0%, #1084d7 50%, #0063b1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-section {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 40px;
            color: white;
            font-size: 14px;
        }

        .time-date {
            text-align: right;
        }

        .time {
            font-size: 64px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .date {
            font-size: 20px;
            opacity: 0.9;
        }

        .middle-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lockscreen-center {
            text-align: center;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .user-avatar {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            font-size: 50px;
        }

        .username {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .hint-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 30px;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .hint-label {
            opacity: 0.7;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .hint-text {
            font-size: 16px;
        }

        .password-input-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .password-field {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 20px;
            border-radius: 4px;
            width: 250px;
            font-size: 14px;
            color: white;
            font-weight: bold;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }

        .password-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0px;
        }

        .password-field:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .submit-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .submit-btn:active {
            transform: scale(0.95);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            animation: shake 0.3s;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-message.show {
            display: block;
        }

        .bottom-section {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .bottom-left {
            opacity: 0.6;
        }

        .bottom-right {
            display: flex;
            gap: 15px;
            opacity: 0.6;
        }

        .success-screen {
            background: linear-gradient(135deg, #0078d4 0%, #1084d7 50%, #0063b1 100%);
            min-height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            z-index: 10;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .success-screen.active {
            display: flex;
        }

        .success-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .success-content {
            position: relative;
            z-index: 1;
            animation: successFadeIn 0.6s ease-out;
        }

        @keyframes successFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: successBounce 0.6s ease-out;
        }

        @keyframes successBounce {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .success-title {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .success-subtitle {
            font-size: 20px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .desktop-icons {
            position: fixed;
            bottom: 50px;
            right: 30px;
            display: none;
            flex-direction: column;
            gap: 20px;
            opacity: 0.7;
        }

        .desktop-icons.show {
            display: flex;
            animation: fadeIn 1.5s ease-in;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .desktop-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .icon-image {
            font-size: 40px;
        }

        .icon-label {
            color: white;
            font-size: 11px;
            text-align: center;
            max-width: 50px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container" id="lockscreen">
        <div class="top-section">
            <div class="time-date">
                <div class="time" id="currentTime">10:30</div>
                <div class="date" id="currentDate">2024년 8월 19일 화요일</div>
            </div>
        </div>

        <div class="middle-section">
            <div class="lockscreen-center">
                <div class="user-avatar">👤</div>
                <div class="username">MIK</div>
                
                <div class="hint-box">
                    <div class="hint-label">💡 힌트</div>
                    <div class="hint-text">내가 제일 좋아하는 책</div>
                </div>

                <div class="password-input-container">
                    <input 
                        type="password" 
                        class="password-field" 
                        id="passwordInput" 
                        placeholder="암호를 입력하세요"
                        onkeypress="handleKeyPress(event)"
                    >
                    <button class="submit-btn" onclick="checkPassword()">→</button>
                </div>
                <div class="error-message" id="errorMessage">❌ 암호가 틀렸습니다</div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="bottom-left">
                <div>Windows</div>
            </div>
            <div class="bottom-right">
                <div>⚙️</div>
                <div>🔋</div>
                <div>🌐</div>
                <div>🔊</div>
            </div>
        </div>
    </div>

    <div class="success-screen" id="successScreen">
        <div class="success-content">
            <div class="success-icon">✓</div>
            <div class="success-title">잠금 해제됨</div>
            <div class="success-subtitle">다음 미션으로 이동합니다...</div>
        </div>
        <div class="desktop-icons" id="desktopIcons">
            <div class="desktop-icon">
                <div class="icon-image">📁</div>
                <div class="icon-label">파일</div>
            </div>
            <div class="desktop-icon">
                <div class="icon-image">🖥️</div>
                <div class="icon-label">컴퓨터</div>
            </div>
            <div class="desktop-icon">
                <div class="icon-image">🌐</div>
                <div class="icon-label">인터넷</div>
            </div>
            <div class="desktop-icon">
                <div class="icon-image">⚙️</div>
                <div class="icon-label">설정</div>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = "tnausworntjddlfhs";

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('ko-KR', options);
            document.getElementById('currentDate').textContent = dateStr;
        }

        updateTime();
        setInterval(updateTime, 1000);

        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const errorMessage = document.getElementById('errorMessage');
            
            if (input.value === CORRECT_PASSWORD) {
                document.getElementById('lockscreen').style.display = 'none';
                document.getElementById('successScreen').classList.add('active');
                setTimeout(() => {
                    document.getElementById('desktopIcons').classList.add('show');
                }, 1000);
            } else {
                errorMessage.classList.add('show');
                input.value = '';
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 2000);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                checkPassword();
            }
        }

        document.getElementById('passwordInput').focus();
    </script>
</body>
</html>
